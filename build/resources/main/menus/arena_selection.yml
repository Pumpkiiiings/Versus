# ═══════════════════════════════════════════════
#     MENÚ DE SELECCIÓN DE ARENA — Versus Plugin
# ═══════════════════════════════════════════════
# Referencia de slots (rows: 3 = 27 slots totales):
#   Fila 1 → slots  0.. 8
#   Fila 2 → slots  9..17
#   Fila 3 → slots 18..26
# Los íconos de arena se añaden automáticamente.

title: "&8Seleccionar Arena"
rows: 3

# ── Botón de arena aleatoria ─────────────────────
random-arena-button:
  material: NETHER_STAR
  name: "&dArena Aleatoria"
  lore:
    - "&7Selecciona una arena disponible al azar."
  flags:
    - HIDE_ATTRIBUTES

# ── Ícono de cada arena ──────────────────────────
arena-icon:
  material: PAPER
  name: "&e{arena}"
  lore:
    - "&7Kits soportados: &f{kits}"
    - "&7Disponible: {available}"
  available-yes: "&aSi"
  available-no: "&cNo"
  flags:
    - HIDE_ATTRIBUTES
