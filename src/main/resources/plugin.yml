name: Versus
version: '${version}'
main: me.robomonkey.versus.Versus
prefix: Versus
api-version: 1.16
authors: [ robomonkey ]
description: Dueling optimized for Semi-Vanilla servers and casual fun.
softdepend: [ PlaceholderAPI, ItemsAdder, Vault ]

commands:
  arena:
    description: Create, edit, and delete dueling arenas.
  duel:
    description: Request to duel with another player.
  spectate:
    description: Spectate a player in a duel.
  versus:
    description: Configure Versus.
  duelgroup:
    description: Manage party and group duels.
  versustest:
    description: Test cosmetics and other features.
  versustats:
    description: Manage player stats.