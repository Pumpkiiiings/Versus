title: "&8Cosmeticos"
rows: 3   # 1-6 filas (27 slots con rows: 3)

# ── Botón: Efectos de Asesinato ─────────────────
kill-button:
  slot: 11
  material: DIAMOND_SWORD
  name: "&cEfectos de Asesinato"
  lore:
    - "&7Haz clic para ver y"
    - "&7seleccionar tus efectos."
  flags:
    - HIDE_ATTRIBUTES

# ── Botón: Efectos de Victoria ──────────────────
victory-button:
  slot: 15
  material: FIREWORK_ROCKET
  name: "&bEfectos de Victoria"
  lore:
    - "&7Haz clic para ver y"
    - "&7seleccionar tus efectos."
  flags:
    - HIDE_ATTRIBUTES

# ── Relleno de fondo ────────────────────────────
# enabled: true  → rellena los slots vacíos
# fill-slots     → lista de slots específicos a rellenar (comenta o elimina para rellenar TODOS)
# Slots en un menú de 3 filas (rows:3):
#   Fila 1 → slots  0..8
#   Fila 2 → slots  9..17
#   Fila 3 → slots 18..26
empty-button:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  name: " "
  flags:
    - HIDE_ATTRIBUTES
